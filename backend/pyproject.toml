[project]
name = "researchmate"
version = "0.1.0"
description = "arXiv reader that records reading signals for the research-taste project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
