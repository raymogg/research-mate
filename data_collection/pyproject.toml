[project]
name = "taste-collect"
version = "0.1.0"
description = "Builds the arXiv paper catalog (metadata + SPECTER2 embeddings) and pushes it to the Fly app"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2",
    "torch>=2.7",
    "transformers>=4.45",
    "adapters>=1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# CUDA 12.8 wheels on Linux (needed for Blackwell cards such as the RTX PRO 5000);
# the default PyPI wheels elsewhere (CPU / Apple MPS), for testing on a Mac.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
