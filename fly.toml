# Fly.io: one small machine + one volume for SQLite, PDFs and feedback.log.
# See DEPLOY.md. `app` must be globally unique; pick a region near you (`fly platform regions`).
app = "taste-reader"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  # OAuth redirect URIs are built from this; change it with a custom domain.
  # Provider apps are secrets: fly secrets set GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
  # (and GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET). See DEPLOY.md.
  PUBLIC_URL = "https://taste-reader.fly.dev"
  # /data/catalog.db (papers + embeddings for suggestions) is built on the GPU
  # machine and uploaded by data_collection/ (`make push` there).
  # INVITE_CODE is a secret: fly secrets set INVITE_CODE=...

[[mounts]]
  source = "taste_data"
  destination = "/data"
  # Fly snapshots the volume daily; these are the backups. Days kept (1-60).
  # Applies to volumes created from now on; the existing one was set with
  # `fly volumes update <vol-id> --snapshot-retention 14`.
  snapshot_retention = 14

[http_service]
  internal_port = 8000
  force_https = true
  # Always on, so nobody waits for a cold start. Deploys still restart it
  # (~10-20 s); events are buffered in the browser meanwhile.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/feedback/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"  # room for the catalog vectors behind suggestions
